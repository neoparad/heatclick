name = "ugokilink-collector-jp"
main = "entry.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

[vars]
STORAGE_REGION = "jp"

[[queues.producers]]
binding = "MAIN_QUEUE"
queue = "ugk-ingest-main-jp"

[[queues.producers]]
binding = "CUSTOM_EVENT_QUEUE"
queue = "ugk-ingest-custom-jp"

[[queues.producers]]
binding = "DELETION_QUEUE"
queue = "ugk-deletion-jp"

[[r2_buckets]]
binding = "R2_SPILL"
bucket_name = "ugk-spill-jp"

[[r2_buckets]]
binding = "R2_HOLD"
bucket_name = "ugk-hold-jp"

[[r2_buckets]]
binding = "R2_QUARANTINE"
bucket_name = "ugk-quarantine-jp"

# Required secrets (set via `npx wrangler secret put <NAME>`):
#   SITE_KEYS_JSON                  — JSON array of SiteKeyRegistration (generated by scripts/link/bootstrap-bihadashop.mjs)
#   CONTINUITY_TOKEN_SECRET         — 32+ byte random hex
#   LAB_MARKER_SECRET               — 32+ byte random hex
# Optional:
#   ROTATED_CONTINUITY_SECRETS_JSON — JSON array of previous continuity secrets during rotation
