name = "ugokilink-wal-jp"
main = "entry.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

[vars]
STORAGE_REGION = "jp"

[[queues.consumers]]
queue = "ugk-ingest-main-jp"
max_batch_size = 100
max_batch_timeout = 5
max_retries = 5

[[r2_buckets]]
binding = "R2_WAL"
bucket_name = "ugk-wal-jp"

[[r2_buckets]]
binding = "R2_QUARANTINE"
bucket_name = "ugk-quarantine-jp"

# Required secrets:
#   QUARANTINE_ENCRYPTION_MASTER_KEY — 32+ byte random hex for per-tenant AES-256-GCM quarantine encryption
